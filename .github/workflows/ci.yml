name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Application Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: SDK Android
        run: scripts/install-android-sdk.sh
      - uses: gradle/actions/setup-gradle@v6
      - name: Vérifications et APK de développement
        run: ./gradlew ktlintCheck lint test assembleDebug --stacktrace
      - name: Rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

  tts:
    name: Atelier TTS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tts
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync
      - run: uv run ruff check
      - run: uv run pytest
