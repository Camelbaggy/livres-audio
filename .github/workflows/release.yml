name: APK signé

on:
  workflow_dispatch:

jobs:
  release:
    name: assembleRelease
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: SDK Android
        run: scripts/install-android-sdk.sh
      - uses: gradle/actions/setup-gradle@v6
      - name: Clé de signature
        env:
          LA_KEYSTORE_BASE64: ${{ secrets.LA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$LA_KEYSTORE_BASE64" ]; then
            echo "::error::Secret LA_KEYSTORE_BASE64 absent (voir docs/prerequis.md)"; exit 1
          fi
          echo "$LA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/livres-audio.jks"
          echo "LA_KEYSTORE_FILE=$RUNNER_TEMP/livres-audio.jks" >> "$GITHUB_ENV"
      - name: Construction de l'APK signé
        env:
          LA_KEYSTORE_PASSWORD: ${{ secrets.LA_KEYSTORE_PASSWORD }}
          LA_KEY_ALIAS: ${{ secrets.LA_KEY_ALIAS }}
          LA_KEY_PASSWORD: ${{ secrets.LA_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace
      - name: Effacement de la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/livres-audio.jks"
      - uses: actions/upload-artifact@v7
        with:
          name: livres-audio-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
